version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: financial_db
    restart: always
    environment:
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: bot_password
      POSTGRES_DB: financial_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_user -d financial_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: financial_bot
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    command: >
      sh -c "alembic upgrade head && python source/main.py"

volumes:
  pgdata: